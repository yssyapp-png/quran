name: quran
description: "تطبيق القرآن الكريم - قراءة واستماع وتفسير"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  just_audio: ^0.9.36
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# يستبدل شاشة البداية الافتراضية (البيضاء الفارغة) بشاشة بهوية التطبيق
# (خلفية خضراء داكنة + أيقونة المصحف) في نفس الوضعين الليلي والنهاري.
flutter_native_splash:
  color: "#0C2320"
  image: assets/icon/app_icon.png
  color_dark: "#0C2320"
  image_dark: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#0C2320"
    image_dark: assets/icon/app_icon.png
    color_dark: "#0C2320"

flutter:
  uses-material-design: true
  assets:
    # نضمّن ملفات التشغيل فقط، وليس نسخة PDF النصية الاحتياطية المحلية.
    - assets/data/hafs_smart_v8.json
    - assets/data/tafsir_saadi/
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf
